<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Set a new password — Family Calendar</title>
  <link rel="stylesheet" href="/auth/styles.css">
  <script src="/auth/reset-password.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="reset-title">
      <div class="auth-mark" aria-hidden="true">▦</div>
      <h1 id="reset-title">Set a new password</h1>
      <p class="auth-intro">Use the one-time link provided by your administrator after your identity was verified. The link expires after 30 minutes.</p>
      <form id="reset-password-form">
        <label for="new-password">New password (at least 14 characters)</label>
        <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="14" maxlength="200" required>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirm" type="password" autocomplete="new-password" minlength="14" maxlength="200" required>
        <p id="reset-message" role="status" aria-live="polite" class="muted small"></p>
        <button id="reset-submit" type="submit">Reset password</button>
      </form>
      <p id="reset-success" hidden><a href="/login">Sign in with your new password</a></p>
      <p class="auth-footnote">Resetting your password signs out other remembered devices. Do not share your reset link.</p>
    </section>
  </main>
</body>
</html>
