<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Family account — Family Calendar</title>
  <link rel="stylesheet" href="/auth/styles.css">
  <script src="/auth/account.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="account-title">
      <a class="back-link" href="/">← Back to calendar</a>
      <h1 id="account-title">Family account</h1>
      <p id="whoami" class="muted">Loading account…</p>
      <section id="household-section" class="household-section" aria-labelledby="household-heading" hidden>
        <h2 id="household-heading">Your household calendar</h2>
        <p id="household-description" class="small muted">Only households you have permission to access appear here.</p>
        <form id="household-switch-form" hidden>
          <label for="household-select">Choose a household</label>
          <select id="household-select" required></select>
          <button id="household-switch-button" type="submit">Open selected calendar</button>
        </form>
        <p id="household-current" class="household-current" hidden></p>
        <p id="household-message" class="small" role="status" aria-live="polite"></p>
      </section>
      <h2>Trusted devices</h2>
      <p class="small muted">You stay signed in on devices you use. Revoke access to a device that was lost or is no longer trusted.</p>
      <p id="account-message" role="status" aria-live="polite"></p>
      <div id="devices" class="device-list" aria-live="polite"></div>
      <button id="logout" type="button" class="secondary-button">Sign out of this device</button>
    </section>
  </main>
</body>
</html>
