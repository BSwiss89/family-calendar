name: Deployment safety

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-safety:
    name: Deployment safety
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test PWA package allowlist
        run: node --test scripts/test-pwa-prebuild-only.mjs
      - name: Check deployment PowerShell syntax and validator output isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @('scripts/deploy-frontend.ps1', 'scripts/release.ps1')
          foreach ($file in $scripts) {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "$file has PowerShell syntax errors: $($errors -join '; ')"
            }
            $text = Get-Content -LiteralPath $file -Raw
            if ($text -notmatch 'check-pwa-prebuild-only\.mjs') {
              throw "$file is missing the PWA validator"
            }
            $lines = $text -split "\r?\n"
            $invocations = @($lines | Where-Object { $_ -match 'check-pwa-prebuild-only\.mjs' -and $_ -match '& node' })
            if ($invocations.Count -ne 1 -or $invocations[0] -notmatch '\|\s*Out-Host') {
              throw "$file must route PWA validator stdout to Out-Host, not the deployment plan pipeline"
            }
            Write-Host "[PASS] $file parses and isolates validator output"
          }
      - name: Test Arney wake phrases and fallback
        run: node --experimental-strip-types --test scripts/test-arney-voice.mjs
      - name: Test Arney safe calendar and list commands
        run: node --experimental-strip-types --test scripts/test-arney-commands.mjs
      - name: Test family authentication and trusted-device security
        run: node --test scripts/test-family-auth.mjs
      - name: Test isolated household data and upload boundaries
        run: node --test scripts/test-household-storage.mjs
      - name: Exercise two real private household API instances
        run: node --test scripts/test-household-instance-isolation.mjs
      - name: Reject unsafe staged multi-household database restores
        run: node --test scripts/test-private-restore-preflight.mjs
      - name: Rehearse an isolated verified two-family restore and failure rollback
        run: node --test scripts/test-private-offline-restore-rehearsal.mjs
      - name: Check central user-to-household grants and denial rules
        run: node --test scripts/test-household-memberships.mjs
      - name: Verify private household upstream service credentials
        run: node --test scripts/test-private-upstream-access.mjs
      - name: Reject unaudited event mutation routes in the private gateway
        run: node --test scripts/test-private-gateway-mutation-policy.mjs
      - name: Exercise authenticated private household gateway end-to-end
        run: node --test scripts/test-private-household-gateway.mjs
      - name: Test explicitly selected event-only sharing and private calendar boundaries
        run: node --test scripts/test-event-only-shares.mjs
      - name: Test safe read-only shared event calendar overlays
        run: node --experimental-strip-types --test scripts/test-shared-event-overlay.mjs
      - name: Test event invitation UI field allowlists and trusted recipients
        run: node --experimental-strip-types --test scripts/test-event-sharing-ui-model.mjs
      - name: Verify personal and hub account creator audit isolation
        run: node --test scripts/test-event-creator-audit.mjs
      - name: Check Share Events modal placement over Events page
        run: node --test scripts/test-event-sharing-modal-placement.mjs
      - name: Build frontend
        run: npm run build
      - name: Rehearse disposable two-family browser demo over localhost
        run: node --test scripts/test-household-browser-demo.mjs
