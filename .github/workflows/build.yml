name: Build Family Calendar

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refuse missing LIVE features or household foundations in isolated candidate
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.number == 70 || github.event.pull_request.base.ref == 'feature/live-preserving-household-integration-candidate') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'scripts/audit-household-live-parity.mjs')) {
            throw 'Household/LIVE parity audit is missing; cannot approve candidate.'
          }
          node scripts/audit-household-live-parity.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'LIVE-preservation audit fixture failed.' }
          # Fetch pinned working LIVE baseline for read-only Git object comparisons.
          # No checkout, reset, merging, DB access, deployment or Tailscale change.
          git fetch --no-tags --depth=1 origin feature/auth-current-calendar-two-sites
          if ($LASTEXITCODE -ne 0) { throw 'Pinned LIVE baseline fetch failed.' }
          node scripts/audit-household-live-parity.mjs --require-preserved-features
          if ($LASTEXITCODE -ne 0) { throw 'Baseline LIVE feature or household foundation file missing.' }
      - name: Validate permanent CI attempt journal with mocked GitHub API
        run: node --test scripts/test-ci-history-journal.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript and build frontend
        run: npm run build
      - name: Verify Duplicate Event drafts are independent of their source
        run: node --test scripts/test-duplicate-event.mjs
      - name: Test list categories and additive migration
        run: node --test scripts/test-list-features.mjs && node --test scripts/test-shopping-stores.mjs && node --test scripts/test-list-icons.mjs
      - name: Verify auth, remembered devices, and separate site cookies
        run: node --test scripts/test-family-auth.mjs
      - name: Test isolated household storage, memberships and secure invitations
        run: |
          node --test scripts/test-household-storage.mjs scripts/test-household-memberships.mjs scripts/test-household-member-invitations.mjs scripts/test-household-member-directory.mjs scripts/test-household-member-access-revocation.mjs
      - name: Test household settings, registration and migration on disposable databases
        run: |
          node --test scripts/test-household-members-settings.mjs scripts/test-private-household-invite-signup.mjs scripts/test-legacy-household-account-rehearsal.mjs
      - name: Reconcile isolated migrated calendar rows and uploads against offline legacy backup
        run: node --test scripts/test-private-legacy-household-reconciliation.mjs
      - name: Test invite-only independent household owner onboarding
        run: node --test scripts/test-independent-household-onboarding.mjs
      - name: Activate a real third private household and verify event/List isolation
        run: node --test scripts/test-independent-household-activation.mjs
      - name: Verify reviewed primary household and invited friend TEST startup plan
        run: node --test scripts/test-private-reviewed-test-startup-plan.mjs
      - name: Verify approved-only private supervisor startup and lock fencing
        run: node --test scripts/test-private-approved-household-startup.mjs
      - name: Exercise disposable supervisor against real Node children and authenticated loopback health
        run: node --test scripts/test-private-disposable-reviewed-windows-supervisor-runtime.mjs
      - name: Rehearse pinned Windows scheduler handoff around real disposable Node children
        run: node --test scripts/test-private-disposable-pinned-windows-host-handoff.mjs
      - name: Verify real-household supervisor OS child ownership and durable crash hold
        run: node --test scripts/test-private-reviewed-windows-supervisor-ownership.mjs
      - name: Verify private Windows supervisor crash hold and restart refusal
        run: node --test scripts/test-private-windows-supervisor-crash-hold.mjs
      - name: Audit Windows protected-port ownership with synthetic inventory
        run: node --test scripts/test-private-windows-port-owners.mjs
      - name: Audit Windows TEST host readiness using safe synthetic inventories
        run: node --test scripts/test-private-windows-test-readiness.mjs
      - name: Verify accepted shared event overlays and parsing
        run: node --test scripts/test-live-received-shared-calendar.mjs scripts/test-shared-event-overlay.mjs
      - name: Verify LIVE desktop and mobile household invitation inbox
        run: node --test scripts/test-live-invitation-inbox.mjs
      - name: Verify LIVE event detail single-share entry point
        run: node --test scripts/test-live-single-event-share-action.mjs
      - name: Verify private upstream authentication and household mutation boundaries
        run: |
          node --test scripts/test-private-upstream-access.mjs scripts/test-private-gateway-mutation-policy.mjs scripts/test-private-event-source-outbox.mjs
      - name: Verify supervised shutdown and exclusive owner lock through offline backup
        run: node --test scripts/test-private-disposable-supervised-backup-handshake.mjs
      - name: Capture and independently attest disposable coordinated multi-family backup
        run: node --test scripts/test-private-disposable-coordinated-snapshot.mjs
      - name: Verify synthetic household AI budgets and offline backup restore safety
        run: |
          node --test scripts/test-private-local-ai-budget.mjs scripts/test-private-paid-api-budget.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Private household AI budget test failure.' }
          node --test scripts/test-private-restore-preflight.mjs scripts/test-private-offline-restore-rehearsal.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Private household offline restore test failure.' }
      - name: Refuse concurrent private gateways and unreviewed stale writer locks
        run: node --test scripts/test-private-gateway-writer-lock.mjs
      - name: Inspect abandoned private gateway locks without clearing them
        run: node --test scripts/test-private-gateway-recovery-audit.mjs
      - name: Verify supervised disposable gateway and backend shutdown fencing
        run: node --test scripts/test-private-supervised-writer-quiescence.mjs
      - name: Rehearse actual orphaned gateway lock after a synthetic process crash
        run: node --test scripts/test-private-gateway-process-crash.mjs
      - name: Crash actual Family A backend and prove Family B data remains independent
        run: node --test scripts/test-private-backend-process-crash.mjs
      - name: Verify private gateway restart binding retries transport only
        run: node --test scripts/test-private-gateway-binding-retry.mjs
      - name: Test real two-household private gateway with LIVE Lists preserved
        run: |
          node --test scripts/test-private-household-gateway.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Two-household private gateway tests failed.' }
          node --test scripts/test-household-browser-demo.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Two-household browser demo tests failed.' }
      - name: Check backend JavaScript syntax
        run: node --check Server/index.mjs
      - name: Check recovery test JavaScript syntax
        run: node --check scripts/verify-sqlite-recovery.mjs
      - name: Check migration preflight JavaScript syntax
        run: node --check scripts/preflight-migrations.mjs
      - name: Exercise SQLite migration safety fixtures
        run: node scripts/preflight-migrations.mjs --self-test
      - name: Validate installed runtime packages and Sharp image support
        run: node scripts/verify-staged-dependencies.mjs .
      - name: Check runtime dependency verifier JavaScript syntax
        run: node --check scripts/verify-staged-dependencies.mjs
      - name: Exercise isolated package switch and rollback scenarios
        shell: powershell
        run: .\\scripts\\test-dependency-rollback.ps1
      - name: Keep interrupted package recovery manual-only
        shell: powershell
        run: |
          $module = Get-Content scripts/dependency-swap.ps1 -Raw
          $fixture = Get-Content scripts/test-dependency-rollback.ps1 -Raw
          $deployer = Get-Content scripts/deploy-backend.ps1 -Raw
          $auto = Get-Content scripts/auto-release.ps1 -Raw
          foreach ($needed in @('Get-FamilyCalendarDependencySwapState', 'Restore-FamilyCalendarInterruptedPackageMove', 'INTERRUPTED PACKAGE SWAP SAFETY FIXTURES PASSED')) {
            if (-not ($module.Contains($needed) -or $fixture.Contains($needed))) { throw "Missing interruption recovery coverage: $needed" }
          }
          if ($deployer.Contains('Restore-FamilyCalendarInterruptedPackageMove') -or $auto.Contains('Restore-FamilyCalendarInterruptedPackageMove')) {
            throw 'Manual-only interrupted npm recovery was wired into unattended deployment'
          }
          if ($deployer -notmatch 'Dependency/unknown file changes require separate review') {
            throw 'Existing package-changing release blocker was removed'
          }
          Write-Host 'POWER-LOSS RECOVERY REMAINS MANUAL AND DEPENDENCY CHANGES BLOCKED'
      - name: Rehearse durable release journal across power-loss boundaries
        shell: powershell
        run: .\scripts\test-dependency-release-journal.ps1
      - name: Verify boot hold for corrupt, empty, and complete-but-present journals
        run: node scripts/test-dependency-release-boot-guard.mjs
      - name: Keep live npm updates blocked and journal checks before any server files
        shell: powershell
        run: |
          $backend = Get-Content Server/index.mjs -Raw
          $auto = Get-Content scripts/auto-release.ps1 -Raw
          $deployer = Get-Content scripts/deploy-backend.ps1 -Raw
          if ($deployer -notmatch 'Dependency/unknown file changes require separate review') {
            throw 'Package-changing production release blocker removed'
          }
          $guard = $backend.IndexOf('assertCalendarReleaseBootSafe(')
          $database = $backend.IndexOf('new DatabaseSync(databasePath)')
          if ($guard -lt 0 -or $database -lt 0 -or $guard -ge $database) {
            throw 'Production startup guard absent or too late after SQLite opened'
          }
          $hold = $auto.IndexOf('if (Test-Path -LiteralPath $dependencyJournal)')
          $git = $auto.IndexOf('foreach ($folder in @($live, $test))')
          if ($hold -lt 0 -or $git -lt 0 -or $hold -ge $git) {
            throw 'Automatic release journal hold absent or runs after Git checks'
          }
          $journal = Get-Content scripts/dependency-release-journal.ps1 -Raw
          foreach ($must in @('[System.IO.File]::Replace', '$stream.Flush($true)', 'Invalid journal transition')) {
            if (-not $journal.Contains($must)) { throw "Missing atomic release-journal feature: $must" }
          }
          Write-Host 'BOOT/JOURNAL FAIL-CLOSED GATES VERIFIED; LIVE NPM DEPLOYMENT STILL BLOCKED'
      - name: Rehearse real npm package activation, corruption detection, and rollback
        shell: powershell
        run: .\\scripts\\rehearse-real-dependency-rollback.ps1
      - name: Rehearse isolated real Node restart and failed dependency recovery
        shell: powershell
        run: .\scripts\rehearse-node-dependency-restart.ps1
      - name: Rehearse combined Git frontend and npm rollback after failed backend startup
        shell: powershell
        run: .\scripts\test-combined-release-rollback.ps1
      - name: Confirm dependency-version-changing drills retain separate manifest and code-only paths
        shell: powershell
        run: |
          $combined = Get-Content scripts/test-combined-release-rollback.ps1 -Raw
          $backend = Get-Content scripts/test-real-backend-candidate.mjs -Raw
          foreach ($marker in @('Real npm dependency difference:', 'Previous Express version, original manifest and lockfile restored', 'approved-code-only', 'Restore-FamilyCalendarReleaseBundle')) {
            if (-not $combined.Contains($marker)) { throw "Missing package-changing rollback fixture: $marker" }
          }
          if (-not $backend.Contains('REAL CALENDAR BACKEND WITH CHANGED NPM VERSION PASSED')) {
            throw 'Real backend has no changed npm version startup fixture'
          }
          Write-Host 'GENUINELY CHANGED DEPENDENCY AND CODE-ONLY DRILLS VERIFIED'
      - name: Confirm dependency gates execute before live backend shutdown
        shell: powershell
        run: |
          $source = Get-Content scripts/deploy-backend.ps1 -Raw
          $stop = $source.IndexOf('Stop-ScheduledTask -TaskName $taskName')
          if ($stop -lt 0) { throw 'Live backend stop was not found' }
          foreach ($gate in @('test-dependency-rollback.ps1', 'stage-dependencies.ps1')) {
            $offset = $source.IndexOf($gate)
            if ($offset -lt 0 -or $offset -ge $stop) {
              throw "Dependency gate missing or occurs after live stop: $gate"
            }
          }
          if ($source -notmatch "Dependency/unknown file changes require separate review") {
            throw 'Dependency-change blocker was unexpectedly removed'
          }
          if ($source -notmatch 'Restore-FamilyCalendarCodeAndFrontend') {
            throw 'Guarded backend deployment is not using shared code/frontend rollback'
          }
          if ($source -notmatch [regex]::Escape('if ($didStop -and $problems.Count -eq 0')) {
            throw 'Guarded backend deployment could restart before failed recovery is resolved'
          }
          if ($source -notmatch 'release-bundle-rollback.ps1') {
            throw 'Shared release recovery helper not imported before server stop'
          }
          Write-Host 'BACKEND DEPENDENCY GATES VERIFIED BEFORE SERVER SHUTDOWN'
      - name: Validate isolated real-backend candidate test syntax
        run: node --check scripts/test-real-backend-candidate.mjs
      - name: Boot actual calendar API against isolated npm and synthetic SQLite
        run: node scripts/test-real-backend-candidate.mjs --self-test
      - name: Validate read-only dependency cutover scope checker syntax
        run: node --check scripts/check-dependency-change-scope.mjs
      - name: Reject unauthorized npm scope and database migration modifications
        run: node scripts/check-dependency-change-scope.mjs --self-test
      - name: Confirm existing package-changing auto-deployment remains blocked
        shell: powershell
        run: |
          $backend = Get-Content scripts/deploy-backend.ps1 -Raw
          if ($backend -notmatch 'Dependency/unknown file changes require separate review') {
            throw 'Backend release dependency-change blocker was removed'
          }
          $preview = Get-Content scripts/preview-dependency-cutover.ps1 -Raw
          foreach ($forbidden in @('Stop-ScheduledTask', 'Start-ScheduledTask', 'Move-Item', 'Remove-Item', 'npm ci', 'git fetch', 'git merge', 'git reset')) {
            if ($preview.Contains($forbidden)) {
              throw "Read-only cutover preview contains forbidden operation: $forbidden"
            }
          }
          Write-Host 'READ-ONLY PREVIEW AND EXISTING DEPENDENCY BLOCK VERIFIED'
      - name: Validate commit-pinned candidate verifier syntax
        run: node --check scripts/verify-commit-dependencies.mjs
      - name: Exercise preserved candidate metadata and tamper protection
        run: node scripts/verify-commit-dependencies.mjs --self-test
      - name: Validate PowerShell script syntax
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors) {
              $parseErrors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell syntax error in $($_.Name)"
            }
          }

  ci-history:
    name: ci-history
    needs: frontend-build
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Preserve CI initial attempt, failures and reruns in GitHub Issue #84
        uses: actions/github-script@v7
        with:
          script: |
            return await (async function recorder(github, context, core) {
              const { owner, repo } = context.repo;
              const issue_number = 84;
              const run_id = Number(context.runId);
              const currentAttempt = Number(context.runAttempt ?? process.env.GITHUB_RUN_ATTEMPT);
              if (!Number.isSafeInteger(run_id) || !Number.isSafeInteger(currentAttempt) || currentAttempt < 1) {
                throw new Error('Untrusted or missing workflow run / attempt number');
              }
              const timestamp = (value) => {
                if (!value) return 'not reported';
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) return 'invalid timestamp';
                const central = new Intl.DateTimeFormat('en-US', {
                  timeZone: 'America/Chicago', year: 'numeric', month: '2-digit',
                  day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit',
                  hour12: true, timeZoneName: 'short'
                }).format(date);
                return `${date.toISOString()} (UTC); ${central} (Central)`;
              };
              const marker = (attempt) => `<!-- fc-ci-attempt:v1:${run_id}:${attempt} -->`;
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
              if (run.repository?.full_name !== `${owner}/${repo}`) {
                throw new Error('Workflow run repository identity mismatch');
              }
              const previous = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100
              });
              const known = new Set(
                previous
                  .filter((comment) => comment.user?.login === 'github-actions[bot]')
                  .flatMap((comment) => [...(comment.body || '').matchAll(/<!-- fc-ci-attempt:v1:(\d+):(\d+) -->/g)]
                    .map((match) => `${match[1]}:${match[2]}`))
              );
              for (let attempt = 1; attempt <= currentAttempt; attempt++) {
                if (known.has(`${run_id}:${attempt}`)) continue;
                // GitHub may carry completed jobs from the previous attempt into a
                // single-job rerun, re-labelling them with the new attempt number.
                // Only count work actually completed after this attempt began.
                const { data: attemptRun } = await github.rest.actions.getWorkflowRunAttempt({
                  owner, repo, run_id, attempt_number: attempt
                });
                const beganAt = Date.parse(attemptRun.run_started_at);
                if (attemptRun.run_attempt !== attempt || !Number.isFinite(beganAt)) {
                  throw new Error(`Attempt ${attempt} has unverified start metadata`);
                }
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                  owner, repo, run_id, attempt_number: attempt, per_page: 100
                });
                const candidateJobs = jobs.filter((job) => job.name !== 'ci-history');
                if (candidateJobs.some((job) => job.status !== 'completed' ||
                  !Number.isFinite(Date.parse(job.completed_at)))) {
                  throw new Error(`Attempt ${attempt} has unfinished or undated test jobs; refusing incomplete archive`);
                }
                const tested = candidateJobs.filter((job) =>
                  Date.parse(job.completed_at) >= beganAt);
                const carriedForward = candidateJobs.length - tested.length;
                const conclusions = tested.map((job) => job.conclusion || 'unknown');
                const result = !tested.length
                  ? 'NO TEST JOB RERUN'
                  : conclusions.every((status) => status === 'success')
                    ? 'PASS'
                    : conclusions.some((status) => ['failure', 'timed_out', 'cancelled', 'action_required'].includes(status))
                      ? 'FAIL'
                      : 'NOT PASSED';
                const stepCount = tested.reduce((sum, job) => sum + (job.steps || []).length, 0);
                const passedCount = tested.reduce((sum, job) =>
                  sum + (job.steps || []).filter((step) => step.conclusion === 'success').length, 0);
                const rows = [];
                for (const job of tested) {
                  rows.push(`### Job: ${job.name} — ${job.conclusion || 'no conclusion'}`);
                  rows.push(`Started: ${timestamp(job.started_at)}`);
                  rows.push(`Completed: ${timestamp(job.completed_at)}`);
                  rows.push('');
                  rows.push('| Step | Result | Finished (UTC and Central) |');
                  rows.push('|---|---|---|');
                  for (const step of job.steps || []) {
                    const safeName = String(step.name || 'unnamed')
                      .replace(/\|/g, '\\|').replace(/\r?\n/g, ' ');
                    rows.push(`| ${step.number}: ${safeName} | ${step.conclusion || step.status || 'unknown'} | ${timestamp(step.completed_at)} |`);
                  }
                  rows.push('');
                }
                const text = [
                  marker(attempt),
                  `## CI attempt ${attempt} — ${result}`,
                  `Workflow: ${run.name || 'unknown'}  `,
                  `Run ID: \`${run_id}\`  `,
                  `Attempt: **${attempt} of ${currentAttempt} observed**  `,
                  `Event: \`${run.event || 'unknown'}\`  `,
                  `Head SHA: \`${run.head_sha || 'unknown'}\`  `,
                  `Run: https://github.com/${owner}/${repo}/actions/runs/${run_id}  `,
                  `Recorded: ${timestamp(new Date().toISOString())}  `,
                  `Attempt began: ${timestamp(attemptRun.run_started_at)}`,
                  `Test jobs executed in this attempt: ${tested.length}; successful steps: **${passedCount}/${stepCount}**`,
                  `Earlier jobs carried forward by GitHub (excluded): ${carriedForward}`,
                  '',
                  ...(tested.length ? rows : [
                    'This was a history-only rerun; no test job was executed in this attempt.',
                    'The previous attempt records remain unchanged.'
                  ]),
                  '',
                  '_This durable summary is independent of GitHub Actions log retention. It preserves step outcomes, not raw logs or secrets._'
                ].join('\n');
                if (text.length > 60000) {
                  throw new Error(`Attempt ${attempt} summary is oversized; refusing to silently truncate it`);
                }
                await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
                core.info(`Permanently recorded CI run ${run_id} attempt ${attempt}: ${result}`);
                known.add(`${run_id}:${attempt}`);
              }
            })(github, context, core)
