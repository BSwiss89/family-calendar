name: Profile picker browser regressions

on:
  pull_request:
    paths:
      - 'src/HouseholdProfilePicker*'
      - 'src/householdProfileSelection*'
      - 'src/ReleaseHighlights*'
      - 'src/releaseNoticeModel*'
      - 'scripts/test-release-highlights-browser.mjs'
      - 'src/App.tsx'
      - 'src/App.css'
      - 'src/FamilyDailyNotes*'
      - 'scripts/test-home-quickadd-notes-browser.mjs'
      - 'src/homeWidgetLayout.ts'
      - 'scripts/test-home-widget-layout.mjs'
      - 'scripts/test-home-weather-browser.mjs'
      - 'scripts/test-profile-picker-browser.mjs'
      - 'scripts/test-mobile-profile-editor.mjs'
      - '.github/workflows/profile-picker-browser.yml'

permissions:
  contents: read

jobs:
  profile-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install browser test tooling without changing dependency manifests
        run: npm install --prefix "$RUNNER_TEMP/profile-browser-tools" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - run: '"$RUNNER_TEMP/profile-browser-tools/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - name: Exercise real React profile lifecycle with disposable mocked APIs
        env:
          FAMILY_CALENDAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/profile-browser-tools/node_modules/playwright/index.mjs
        run: node --test scripts/test-profile-picker-browser.mjs
      - name: Reproduce baseline and verify real mobile photo editing in Chromium and WebKit
        env:
          FAMILY_CALENDAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/profile-browser-tools/node_modules/playwright/index.mjs
        run: node --test scripts/test-mobile-profile-editor.mjs
      - name: Verify Quick Add five-action fit and Home Notes top alignment in Chromium and WebKit
        env:
          FAMILY_CALENDAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/profile-browser-tools/node_modules/playwright/index.mjs
        run: node --test scripts/test-home-quickadd-notes-browser.mjs
      - name: Verify weather card readability across widths and heights in Chromium and WebKit
        env:
          FAMILY_CALENDAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/profile-browser-tools/node_modules/playwright/index.mjs
        run: node --test scripts/test-home-weather-browser.mjs
      - name: Verify update acknowledgement and invitation priority in Chromium and WebKit
        env:
          FAMILY_CALENDAR_PLAYWRIGHT_MODULE: ${{ runner.temp }}/profile-browser-tools/node_modules/playwright/index.mjs
        run: node --test scripts/test-release-highlights-browser.mjs
